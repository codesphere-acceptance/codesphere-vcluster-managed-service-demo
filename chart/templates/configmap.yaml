apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "demo-app.name" . }}
  labels:
    {{- include "demo-app.labels" . | nindent 4 }}
data:
  index.html: |
    <!doctype html>
    <html lang="en">
      <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>{{ .Values.page.title }}</title>
        <style>
          body { margin: 0; font-family: system-ui, sans-serif; background: #0b1020; color: #e8ecf5;
                 min-height: 100vh; display: grid; place-items: center; }
          main { max-width: 40rem; padding: 2.5rem; text-align: center; }
          h1 { font-size: 1.6rem; line-height: 1.3; margin: 0 0 1rem; }
          p { color: #9aa6c2; line-height: 1.6; }
          .badge { display: inline-block; margin-top: 1.5rem; padding: .4rem .9rem;
                   border: 1px solid #2a3763; border-radius: 999px; color: #7fd1ae; font-size: .85rem; }
        </style>
      </head>
      <body>
        <main>
          <h1>{{ .Values.page.heading }}</h1>
          <p>{{ .Values.page.subheading }}</p>
          <span class="badge">Helm release: {{ .Release.Name }} &middot; namespace: {{ .Release.Namespace }}</span>
        </main>
      </body>
    </html>
