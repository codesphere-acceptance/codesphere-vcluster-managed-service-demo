# Codesphere landscape — vCluster + managed service + Helm demo.
#
# One file declares the whole thing: the vCluster booked as a managed service,
# the Helm chart that gets deployed into it, and the headless route that wires a
# custom domain to the running app with TLS at the Codesphere edge.
#
#   prepare -> deploy the Helm chart into the vCluster (helm upgrade --install)
#   run     -> the vCluster managed service + the headless route to the app
#
# Prerequisite: the team's vCluster is a team-level singleton.
# Declaring it below books/references it; the base image auto-mounts its
# kubeconfig (~/.kube/config) into every pod, so `helm` and `kubectl` just work.
schemaVersion: v0.4

prepare:
  steps:
    # The Kubernetes-native app is imported via Helm and deployed
    # reproducibly — the deployment is the direct result of what is declared,
    # not something assembled by hand.
    - name: Deploy the Helm chart into the vCluster
      command: bash deploy/deploy.sh

test:
  steps: []

run:
  # vCluster booked as a managed service, scoped to the team.
  # virtual-k8s is a team singleton; its kubeconfig is injected into the
  # landscape pods so the prepare stage can deploy into it.
  demo-vcluster:
    provider:
      name: virtual-k8s
      schemaVersion: v1
    # Resource quota for the vCluster. These are the `virtual-k8s` "Custom" plan
    # (id 0) parameters, set to lean-but-valid values (each is at/above the
    # provider's minimum). `cpu` is in tenths of a vCPU, the rest in MiB. Verify
    # or refresh against your instance with `mise run providers virtual-k8s`.
    #   cpu: min 32 max 320 | memory: min 4266 max 32768
    #   storage: min 0 max 120000 | ephemeralStorage: min 15360 max 120000
    plan:
      id: 0
      parameters:
        cpu: 32
        memory: 4266
        storage: 2048
        ephemeralStorage: 15360
        loadBalancerLimit: 1

  # Headless route — the custom domain is wired to the app's Service inside
  # the vCluster. Codesphere syncs the in-vCluster Service to the host cluster
  # under a predictable DNS name and terminates TLS at the edge, so the app is
  # reachable over host/path routing, secured by default.
  #
  # Target = http://<service>-x-<namespace>-x-k8s.rg-<teamId>.svc.cluster.local
  # where <service>/<namespace> match RELEASE/NAMESPACE in deploy/deploy.sh.
  demo-app:
    network:
      paths:
        - path: /
          stripPath: false
          target: http://demo-app-x-demo-x-k8s.rg-${{ team.id }}.svc.cluster.local:80
