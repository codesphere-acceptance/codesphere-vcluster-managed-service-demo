# Codesphere landscape — vCluster + managed service + Helm demo.
#
# This file declares the deploy + routing half of the demo: the Helm chart that
# gets deployed into the vCluster, and the headless route that wires a custom
# domain to the running app with TLS at the Codesphere edge.
#
#   prepare -> deploy the Helm chart into the vCluster (helm upgrade --install)
#   run     -> the headless route to the app's in-vCluster Service
#
# Prerequisite: the team's vCluster is a team-level singleton, booked SEPARATELY
# as a managed service (UI: Managed Services, or the Public API) — not declared
# here. `virtual-k8s` is not a `run:` provider in the landscape schema (its
# ci.yml lifecycle integration is still WIP). Once booked, the base image
# auto-mounts its kubeconfig (~/.kube/config) into every pod, so `helm` and
# `kubectl` just work in the prepare stage below.
schemaVersion: v0.4

prepare:
  steps:
    # The Kubernetes-native app is imported via Helm and deployed
    # reproducibly — the deployment is the direct result of what is declared,
    # not something assembled by hand.
    - name: Deploy the Helm chart into the vCluster
      command: bash deploy/deploy.sh

test:
  steps: []

run:
  # Headless route — the custom domain is wired to the app's Service inside
  # the vCluster. Codesphere syncs the in-vCluster Service to the host cluster
  # under a predictable DNS name and terminates TLS at the edge, so the app is
  # reachable over host/path routing, secured by default.
  #
  # Target = http://<service>-x-<namespace>-x-k8s.rg-<teamId>.svc.cluster.local
  # where <service>/<namespace> match RELEASE/NAMESPACE in deploy/deploy.sh.
  demo-app:
    network:
      paths:
        - path: /
          stripPath: false
          target: http://demo-app-x-demo-x-k8s.rg-${{ team.id }}.svc.cluster.local:80
